version: '3.8'

services:
  # 1. Banco de Dados
  db:
    image: mysql:8.0
    container_name: projeto_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gamesearch_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: projeto_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Backend
  backend:
    build: ./backend
    container_name: projeto_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: gamesearch_db
      REDIS_HOST: redis
      PORT: 3000
      JWT_SECRET: supersecretakey

  # 4. Frontend
  frontend:
    build: ./frontend
    container_name: projeto_frontend
    # Mapeia a porta 5173 do container para 5173 do seu PC
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js

volumes:
  db_data:
